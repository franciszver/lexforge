services:
  - type: web
    name: lexforge-demo
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_DEMO_MODE
        value: "1"
      - key: VITE_API_URL
        value: https://lexforge-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: lexforge-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npx prisma generate
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://lexforge-demo.onrender.com
      - key: DAILY_CAP
        value: "300"
